<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #1F3A54;
    color: #F4F1EA;
    font-family: "Inter", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }
  .brand {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 40px;
  }
  .brand svg { width: 54px; color: #F4F1EA; }
  .brand span {
    font-family: "Manrope", system-ui, sans-serif;
    font-weight: 700; font-size: 34px; letter-spacing: -0.02em;
  }
  h1 {
    font-family: "Manrope", system-ui, sans-serif;
    font-weight: 700;
    font-size: 82px;
    line-height: 1.08;
    letter-spacing: -0.022em;
    margin-bottom: 30px;
  }
  p.sub {
    font-size: 27px;
    line-height: 1.5;
    color: rgba(244, 241, 234, 0.82);
    max-width: 820px;
  }
  p.meta {
    margin-top: 44px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #9DB8D2;
  }
  .horizon {
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    color: #2C5B8C;
    opacity: 0.55;
  }
  .horizon svg { display: block; width: 100%; height: 200px; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 120 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 28 H118" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M45 28 A15 15 0 0 1 75 28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span>Horizonte</span>
  </div>

  <h1>Cuentas claras,<br />decisiones seguras.</h1>

  <p class="sub">
    Consultora de Gestión Administrativo-Contable para startups y
    empresas de servicios.
  </p>

  <p class="meta">Mar del Plata · 100% remoto</p>

  <div class="horizon">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M0 168 H1200" stroke="currentColor" stroke-width="3"/>
      <path d="M870 168 A110 110 0 0 1 1090 168" stroke="currentColor" stroke-width="3"/>
    </svg>
  </div>
</body>
</html>
